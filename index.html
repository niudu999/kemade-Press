<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冲床图纸库</title>
<style>
  :root { --bd:#d8dee9; --fg:#1f2933; --dim:#6b7785; --bg:#f7f9fc; --card:#fff; --acc:#1668dc; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .bar { margin-bottom:16px; }
  .bar input { width:320px; max-width:100%; padding:6px 10px; border:1px solid var(--bd);
               border-radius:6px; font-size:13px; }
  .bar button { padding:6px 12px; border:1px solid var(--bd); background:var(--card);
                border-radius:6px; cursor:pointer; font-size:13px; }
  .bar button:hover { border-color:var(--acc); color:var(--acc); }
  h2 { font-size:14px; margin:22px 0 10px; padding-left:8px; border-left:3px solid var(--acc); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:8px; overflow:hidden;
          text-decoration:none; color:inherit; display:block; }
  .card:hover { border-color:var(--acc); box-shadow:0 2px 10px rgba(22,104,220,.12); }
  .card img { display:block; width:100%; height:130px; object-fit:contain; background:#fff; }
  .card .nm { padding:6px 8px; font-size:11px; line-height:1.35; color:var(--dim);
              border-top:1px solid #eef1f5; word-break:break-all; }
  .err { color:#c0392b; padding:12px; background:#fff4f2; border:1px solid #f3c7c0; border-radius:8px; }
</style>
</head>
<body>
<h1>冲床图纸库</h1>
<div class="sub">共 <b id="cnt">-</b> 张 · 直链方式：
  <label><input type="radio" name="mode" value="raw" checked> raw</label>
  <label><input type="radio" name="mode" value="pages"> pages</label>
</div>

<div class="bar">
  <input id="base" placeholder="https://raw.githubusercontent.com/&lt;owner&gt;/&lt;repo&gt;/main">
  <button id="go">加载</button>
</div>

<div id="out"></div>

<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const bySeries = (n) => (n.match(/^(AK[A-Z]|AKM|AKN|AKT)/) || ['其他'])[0];

function defaultBase() {
  // 若本页由 GitHub Pages 提供，可从主机名推出 raw 地址
  const h = location.hostname;
  const m = h.match(/^([^.]+)\.github\.io$/);
  if (m) {
    const repo = location.pathname.split('/').filter(Boolean)[0] || '';
    if (repo) return 'https://raw.githubusercontent.com/' + m[1] + '/' + repo + '/main';
  }
  return '';
}

function baseFor(mode, base) {
  if (mode === 'pages') return base.replace('raw.githubusercontent.com', 'github.io')
                                 .replace(/\/([^/]+)\/([^/]+)\/main$/, '/$1.github.io/$2');
  return base;
}

async function load() {
  const base = ($('#base').value || '').trim().replace(/\/+$/, '');
  const mode = document.querySelector('input[name=mode]:checked').value;
  const out = $('#out');
  if (!base) { out.innerHTML = '<div class="err">请先填写基址</div>'; return; }
  localStorage.setItem('drawings-base', base);
  out.innerHTML = '<div class="sub">加载中…</div>';
  try {
    const r = await fetch(base + '/drawings.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('drawings.json 返回 ' + r.status);
    const names = await r.json();
    $('#cnt').textContent = names.length;
    const groups = {};
    for (const n of names) (groups[bySeries(n)] = groups[bySeries(n)] || []).push(n);
    out.innerHTML = Object.keys(groups).sort().map((k) => {
      const cards = groups[k].sort().map((n) => {
        const url = base + '/drawings/' + encodeURIComponent(n);
        return '<a class="card" href="' + url + '" target="_blank" rel="noopener">'
             + '<img loading="lazy" src="' + url + '" alt="' + n + '">'
             + '<div class="nm">' + n + '</div></a>';
      }).join('');
      return '<h2>' + k + '（' + groups[k].length + '）</h2><div class="grid">' + cards + '</div>';
    }).join('');
  } catch (e) {
    out.innerHTML = '<div class="err">加载失败：' + e.message
      + '<br>若仓库为私有，raw 直链会返回 404；请确认仓库是 public。</div>';
  }
}

$('#go').addEventListener('click', load);
document.querySelectorAll('input[name=mode]').forEach((el) => el.addEventListener('change', load));
window.addEventListener('DOMContentLoaded', () => {
  $('#base').value = params.get('base') || localStorage.getItem('drawings-base') || defaultBase();
  if ($('#base').value) load(); else { $('#cnt').textContent = '0'; }
});
</script>
</body>
</html>
